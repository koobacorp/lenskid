name: macOS build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Tests (looks engine, host simulation on the real plugin)
        run: make test CXX=clang++ LDL=
      - name: Build universal bundle, LUT pack and zip
        run: ./build_mac.sh
      - name: Verify bundle
        run: |
          B=build/LENSKID.ofx.bundle
          grep -q com.koobacorp.lenskid $B/Contents/Info.plist
          lipo -archs $B/Contents/MacOS/LENSKID.ofx | grep -q arm64
          lipo -archs $B/Contents/MacOS/LENSKID.ofx | grep -q x86_64
          for s in OfxGetNumberOfPlugins OfxGetPlugin OfxSetHost; do nm -gU $B/Contents/MacOS/LENSKID.ofx | grep -q "_$s$"; done
          codesign -v --deep $B && codesign -dv $B
          ./build_host_sim $B/Contents/MacOS/LENSKID.ofx
          test "$(ls build/LUTs/LENSKID/*.cube | wc -l)" -eq 7
          for f in build/LUTs/LENSKID/*.cube; do grep -q "LUT_3D_SIZE 33" "$f"; test "$(grep -cE '^[0-9.]+ [0-9.]+ [0-9.]+$' "$f")" -eq 35937; done
          unzip -l build/LENSKID-macOS-universal-v1.0.zip
          shasum -a 256 build/LENSKID-macOS-universal-v1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LENSKID-macOS-universal-v1.0
          path: build/LENSKID-macOS-universal-v1.0.zip
